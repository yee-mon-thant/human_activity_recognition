[project]
name = "human-activity-recognition"
version = "0.1.0"
description = "Human Activity Recognition using smartphone sensor data and machine learning"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "torch>=2.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.28.0",
    "joblib>=1.3.0",
    "jupyter>=1.0.0",
]
